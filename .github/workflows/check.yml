name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    name: make check (Rust agent + firmware host tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install cjson pkg-config
      - run: make check

  firmware:
    name: firmware build (ESP-IDF v6.0, esp32s3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0
          target: esp32s3
          command: idf.py build
